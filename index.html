<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Himnario</title>
<style>
:root{--side:clamp(2px,1vw,8px);--bg:#0d1b1e;--card:#12262a;--btn:#1e3438;--tx:#eef3f1;--mut:#7fa0a0;--gold:#e8b04a}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
button,input,select{font:inherit;color:var(--tx)}
button{background:var(--btn);border:0;border-radius:8px;padding:10px 14px;cursor:pointer;min-height:42px}
button.on{color:var(--gold)}
#list{max-width:720px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
#top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.acts{display:flex;gap:8px;flex:none}
.acts button{font-size:14px;min-height:36px;padding:6px 12px;white-space:nowrap}
h1{font-family:Georgia,serif;color:var(--gold);margin:0;font-size:clamp(22px,6vw,32px)}
#q{width:100%;padding:12px;border-radius:8px;border:1px solid var(--btn);background:var(--card);margin-bottom:12px}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.num{min-width:64px;text-align:center;font:700 22px Georgia,serif;color:var(--gold);background:#0a1416;border-radius:8px;padding:8px}
.num.no{color:var(--mut);font-size:20px}
.it small{color:var(--mut);display:block}
#view{display:none;height:100dvh;flex-direction:column;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;background:var(--bg)}
#grip{position:fixed;right:0;top:calc(env(safe-area-inset-top,0px) + 4px);width:22px;height:40px;display:flex;align-items:center;justify-content:center;background:#ffb020;border-radius:12px 0 0 12px;cursor:pointer;z-index:12;box-shadow:0 2px 10px #0008}
#grip i{width:4px;height:20px;border-radius:3px;background:#3a2600}
body.min #grip{background:#ff9f1c}
body.min #bar,body.min #head,body.min #pal{display:none}
#bar{display:flex;align-items:center;gap:6px;padding:calc(4px + env(safe-area-inset-top,0px)) calc(env(safe-area-inset-right,0px) + 28px) 6px max(8px,env(safe-area-inset-left));border-bottom:1px solid var(--btn);overflow-x:auto;scrollbar-width:none;background:var(--bg)}
#bar::-webkit-scrollbar{display:none}
#bar button{min-height:28px;padding:3px 11px;font-size:13px;border-radius:999px;background:transparent;border:1px solid #2a4448;white-space:nowrap;flex:none}
#bar button.on{color:var(--gold);border-color:var(--gold)}
.seg{display:flex;flex:none;border:1px solid #2a4448;border-radius:999px;overflow:hidden}
#bar .seg button{border:0;border-radius:0;min-width:32px;padding:3px 9px}
#bar .seg button+button{border-left:1px solid #2a4448}
#edit{margin-left:auto}
#head{display:flex;align-items:center;gap:12px;padding:6px max(14px,env(safe-area-inset-right)) 6px max(14px,env(safe-area-inset-left));background:var(--bg)}
#head .num{font-size:26px}
#head h2{margin:0;font:700 clamp(18px,3.5vw,30px) Georgia,serif}
#head small{color:var(--mut)}
#wrap{flex:1;min-height:0;position:relative;padding:6px max(var(--side),env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(var(--side),env(safe-area-inset-left));touch-action:none;overflow:hidden;background:var(--vbg,var(--bg))}
body.min #wrap{padding-top:calc(6px + env(safe-area-inset-top,0px));padding-right:calc(max(var(--side),env(safe-area-inset-right,0px)) + 16px)}
#clip{height:100%;overflow:hidden}
#box{height:100%;overflow:visible;background:linear-gradient(#2a4448,#2a4448) no-repeat 50% 0/1px 100%;column-gap:8px;column-fill:balance;transform-origin:0 0;will-change:transform;color:var(--lyric,var(--tx))}
#box.one{background:none}
.sec{break-inside:avoid;margin-bottom:.8em}
.sec.br{break-before:column}
.lb{font:italic 600 .8em Georgia,serif;color:var(--mut);margin-bottom:2px}
pre{margin:0;font-family:Arimo,Arial,"Liberation Sans",Helvetica,sans-serif;white-space:pre;line-height:var(--lh,1.3)}
pre .c{color:var(--chord,var(--gold))}
.sec.cho pre{border-left:3px solid var(--gold);padding-left:6px}
body.nochords .c{display:none}
#pal{display:none;position:fixed;left:8px;top:calc(46px + env(safe-area-inset-top,0px));z-index:15;background:var(--card);border:1px solid #2a4448;border-radius:14px;padding:8px 12px;box-shadow:0 8px 24px #0009}
#pal.open{display:block}
#pal .r{display:flex;align-items:center;gap:8px;margin:6px 0}
#pal .r>span{width:58px;font-size:12px;color:var(--mut)}
.sw{width:26px;height:26px;min-height:0;padding:0;border-radius:50%;border:1px solid #4a6d72}
.sw.on{outline:2px solid var(--gold);outline-offset:2px}
#cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
#cats button{min-height:34px;padding:6px 12px;font-size:14px}
body.nochords .ci{display:none}
#ed{display:none;position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left))}
#ed .in{max-width:720px;margin:0 auto}
#ed label{display:block;color:var(--mut);font-size:13px;margin:10px 0 4px}
#ed input,#ed textarea,#ed select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--btn);background:var(--card)}
#ed textarea{font-family:Arimo,Arial,sans-serif;min-height:300px;white-space:pre;overflow:auto}
#ed .row{display:flex;gap:8px}#ed .row>div{flex:1}
#ed details{margin-top:14px;color:var(--mut)}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tb button{min-height:34px;padding:6px 10px;font-size:13px}
#cf{display:none;position:fixed;inset:0;background:#000c;z-index:40;align-items:center;justify-content:center;padding:20px}
#cf .bx{background:var(--card);border-radius:14px;padding:22px;max-width:400px;text-align:center}
#cf p{margin:0 0 18px;font-size:19px;line-height:1.35}
#cf button{min-width:110px;margin:0 6px}
#cf_si{color:#ff8a80}
#e_del{color:#ff8a80;margin-left:auto}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.btns button{flex:0 1 auto}
#edmsg{margin:12px 0;color:var(--gold);min-height:1.3em}
#msg{padding:24px;text-align:center;color:var(--mut)}

/* ===== página principal con el estilo de tu sitio ===== */
#site{font-family:'Segoe UI',Tahoma,Geneva,Verdana,system-ui,sans-serif;color:#fff;overflow-x:hidden}
#site ul{list-style:none;margin:0;padding:0}
#fl{position:fixed;inset:0;pointer-events:none;z-index:-1}
#fl i{position:absolute;border-radius:50%;background:linear-gradient(135deg,#ffffff1a,#ffffff0d);animation:flt 6s ease-in-out infinite}
#fl i:nth-child(1){width:80px;height:80px;top:20%;left:10%}
#fl i:nth-child(2){width:120px;height:120px;top:60%;right:15%;animation-delay:2s}
#fl i:nth-child(3){width:60px;height:60px;bottom:20%;left:20%;animation-delay:4s}
@keyframes flt{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-20px) rotate(180deg)}}
.navbar-container{position:fixed;top:30px;left:50%;transform:translateX(-50%);z-index:1000;width:calc(100% - 60px);max-width:1000px}
.navbar{background:#ffffff1a;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid #fff3;border-radius:50px;padding:12px 25px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 20px 40px #0000001a,inset 0 1px 0 #fff3}
.navbar-brand,.mobile-menu-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;font-weight:700;font-size:1.4rem}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#ff6b6b,#4ecdc4);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 8px 16px #0003}
.logo-icon::before{content:'';position:absolute;width:20px;height:20px;background:#ffffffe6;border-radius:50%;animation:lp 2s ease-in-out infinite}
@keyframes lp{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.2);opacity:1}}
.navbar-nav{display:flex;align-items:center;gap:5px}
.nav-link{display:flex;align-items:center;gap:6px;padding:10px 16px;text-decoration:none;color:#ffffffe6;font-weight:500;font-size:.9rem;border-radius:25px;transition:all .3s;white-space:nowrap}
.nav-link:hover{color:#fff;transform:translateY(-2px);background:#ffffff1a;box-shadow:0 8px 20px #00000026}
.nav-link.active{background:linear-gradient(135deg,#fff3,#ffffff1a);color:#fff;box-shadow:inset 0 1px 0 #ffffff4d,0 4px 12px #0000001a}
.nav-icon,.mobile-menu-icon{width:16px;height:16px;fill:currentColor}
.cta-button{background:linear-gradient(135deg,#ff6b6b,#ee5a52);color:#fff;text-decoration:none;padding:10px 20px;border-radius:25px;font-weight:600;font-size:.9rem;box-shadow:0 8px 20px #ff6b6b4d;white-space:nowrap;margin-left:5px;display:inline-block;transition:all .3s}
.cta-button:hover{transform:translateY(-1px)}
.mobile-toggle{display:none;background:none;border:0;padding:8px;border-radius:50%;min-height:0;z-index:1001}
.hamburger{display:flex;flex-direction:column;gap:4px;width:24px;height:18px;justify-content:center}
.hamburger span{width:24px;height:2px;background:#fff;border-radius:2px;transition:all .3s;display:block}
.mobile-toggle.active .hamburger span:nth-child(1){transform:rotate(45deg) translate(6px,6px)}
.mobile-toggle.active .hamburger span:nth-child(2){opacity:0;transform:translateX(-20px)}
.mobile-toggle.active .hamburger span:nth-child(3){transform:rotate(-45deg) translate(6px,-6px)}
@media(max-width:992px){.navbar-container{top:20px;width:calc(100% - 30px)}.navbar{padding:12px 20px}.mobile-toggle{display:flex}.navbar-nav{display:none}.brand-text{font-size:1.2rem}}
@media(max-width:480px){.navbar-container{width:calc(100% - 20px);top:15px}.navbar{padding:10px 15px}.logo-icon{width:35px;height:35px}.brand-text{font-size:1.1rem}}
.mobile-menu-overlay{position:fixed;inset:0;background:#000c;backdrop-filter:blur(10px);z-index:1500;opacity:0;visibility:hidden;transition:all .3s}
.mobile-menu-overlay.active{opacity:1;visibility:visible}
.mobile-menu{position:fixed;top:0;left:0;width:100%;height:100vh;height:100dvh;background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);z-index:1600;transform:translateY(-100%);transition:transform .4s cubic-bezier(.25,.46,.45,.94);overflow-y:auto}
.mobile-menu.active{transform:translateY(0)}
.mobile-menu-header{display:flex;justify-content:space-between;align-items:center;padding:30px 30px 20px;border-bottom:1px solid #ffffff1a}
.mobile-menu-close{background:none;border:0;font-size:2rem;padding:8px;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.mobile-menu-nav{padding:40px 30px 0}
.mobile-menu-link{display:flex;align-items:center;gap:16px;padding:20px 24px;text-decoration:none;color:#ffffffe6;font-weight:500;font-size:1.1rem;border-radius:20px;transition:all .3s;background:#ffffff0d;border:1px solid #ffffff1a;margin-bottom:12px}
.mobile-menu-link:hover,.mobile-menu-link.active{background:#ffffff26;color:#fff;transform:translateX(8px);border-color:#fff3}
.mobile-menu-icon{width:24px;height:24px}
.mobile-cta{margin:30px 30px 40px}
.mobile-cta-button{display:block;background:linear-gradient(135deg,#ff6b6b,#ee5a52);color:#fff;text-decoration:none;padding:20px;border-radius:20px;font-weight:600;font-size:1.1rem;text-align:center;box-shadow:0 10px 30px #ff6b6b4d}
.content-section{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:100px 20px 40px;text-align:center;position:relative}
.section-title{font-family:inherit;font-size:clamp(2rem,6vw,2.5rem);font-weight:700;margin:0 0 20px;color:#fff}
.section-subtitle{font-size:1.1rem;opacity:.8;max-width:600px;line-height:1.6;margin:0 0 30px}
#home{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f0f23 100%);padding-top:200px}
#canciones{background:linear-gradient(135deg,#2d1b69 0%,#11998e 50%,#38ef7d 100%);justify-content:flex-start;padding-top:130px}
#himnario{background:linear-gradient(135deg,#134e5e 0%,#71b280 50%,#2d3748 100%)}
#services{background:linear-gradient(135deg,#4a148c 0%,#6a1b9a 50%,#8e24aa 100%)}
#portfolio{background:linear-gradient(135deg,#1e3c72 0%,#2a5298 50%,#1a202c 100%)}
#contact{background:linear-gradient(135deg,#0f2027 0%,#203a43 50%,#2c5364 100%)}
#list{width:100%;max-width:720px;margin:0;padding:0;text-align:left}
#list #top{margin-bottom:14px}
#list #top .acts{width:100%;justify-content:space-between}
#list .acts button{border-radius:25px;background:#ffffff26;color:#fff;border:1px solid #ffffff33;font-weight:500;transition:all .3s}
#list .acts button:hover{background:#ffffff40;transform:translateY(-1px)}
#list #nw{background:linear-gradient(135deg,#ff6b6b,#ee5a52);border:0;font-weight:600;box-shadow:0 8px 20px #ff6b6b4d}
#list #q{background:#ffffff1f;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid #fff3;border-radius:16px;padding:16px 22px;color:#fff;outline:0}
#list #q::placeholder{color:#ffffffb8}
#list #q:focus{border-color:#ffffff80;background:#ffffff2e}
#list #cats{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px;touch-action:pan-x pan-y}
#list #cats::-webkit-scrollbar{display:none}
#list #cats button{flex:none;white-space:nowrap;border-radius:25px;background:#ffffff1a;border:1px solid #ffffff2e;color:#ffffffe6;transition:all .3s}
#list #cats button:hover{background:#ffffff33;transform:translateY(-2px)}
#list #cats button.on{background:linear-gradient(135deg,#fff3,#ffffff1a);color:#fff;font-weight:600;box-shadow:inset 0 1px 0 #ffffff4d,0 4px 12px #0000001a}
#list .it{background:#ffffff1a;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid #ffffff33;border-radius:20px;padding:10px 16px 10px 10px;box-shadow:0 10px 24px #0000001a,inset 0 1px 0 #ffffff33;color:#fff;font-weight:500;transition:all .3s}
#list .it:hover{transform:translateY(-2px);background:#ffffff2b}
#list .num{background:linear-gradient(135deg,#ff6b6b,#4ecdc4);color:#fff;border-radius:50px;box-shadow:0 6px 14px #0003;font-family:inherit}
#list .num.no{color:#fff}
#list .it small{color:#ffffffbf;font-weight:400}
#list #msg{color:#fffc}
#list #items{display:flex;flex-wrap:nowrap;gap:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scrollbar-width:none;padding:6px 2px 14px;touch-action:pan-x pan-y}
#list #items::-webkit-scrollbar{display:none}
#list #items #msg{min-width:100%}
#list .it{flex:none;width:clamp(190px,58vw,250px);flex-direction:column;align-items:stretch;gap:0;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0;margin:0;text-align:center;scroll-snap-align:start}
#list .it:hover{background:none;transform:translateY(-4px)}
#list .tile{aspect-ratio:1;width:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffffff2e,#ffffff14);border:1px solid #ffffff4d;border-radius:24px;box-shadow:0 12px 28px #00000033,inset 0 1px 0 #ffffff4d;margin-bottom:12px}
#list .c0{background:linear-gradient(135deg,#ff6b6b,#ff9966)}
#list .c1{background:linear-gradient(135deg,#36d1dc,#5b86e5)}
#list .c2{background:linear-gradient(135deg,#a855f7,#ec4899)}
#list .c3{background:linear-gradient(135deg,#11998e,#38ef7d)}
#list .c4{background:linear-gradient(135deg,#f7971e,#ffd200)}
#list .c5{background:linear-gradient(135deg,#667eea,#764ba2)}
#list .c6{background:linear-gradient(135deg,#f953c6,#b91d73)}
#list .c7{background:linear-gradient(135deg,#00c6ff,#0072ff)}
#list .tile .num{background:none;box-shadow:none;padding:0;min-width:0;font-size:clamp(40px,13vw,64px);text-shadow:0 2px 8px #0003}
#list .tt{font-weight:700;font-size:1.05rem;text-transform:uppercase;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#list .it small{margin-top:4px;font-size:.8rem}
.rw{position:relative}
.ar{display:none;position:absolute;top:110px;width:46px;height:46px;min-height:0;padding:0;border-radius:50%;font-size:30px;line-height:1;align-items:center;justify-content:center;background:#ffffff40;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #ffffff59;color:#fff;box-shadow:0 8px 20px #0003;z-index:3}
.ar.l{left:-8px}.ar.r{right:-8px}
.ar:hover{background:#ffffff66}
@media(hover:hover) and (pointer:fine){.ar{display:flex}}
/* ===== pantalla del himno con el mismo estilo moderno ===== */
#view{background:linear-gradient(135deg,#1f1147 0%,#3b2a86 45%,#0e7c86 100%);font-family:'Segoe UI',Tahoma,Geneva,Verdana,system-ui,sans-serif}
#view #bar{background:#ffffff1a;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid #ffffff33;border-radius:0 0 26px 26px;box-shadow:0 10px 30px #0003,inset 0 1px 0 #ffffff33}
#view #bar button{border-color:#ffffff40;color:#ffffffe6;transition:all .3s}
#view #bar button:hover{background:#ffffff26}
#view #bar button.on{color:#fff;border-color:#ffffff99;background:linear-gradient(135deg,#fff3,#ffffff1a)}
#view #bar .seg{border-color:#ffffff40}
#view #bar .seg button+button{border-left-color:#ffffff40}
#view #head{background:transparent}
#view #head .num{background:linear-gradient(135deg,#ff6b6b,#4ecdc4);color:#fff;border-radius:50px;box-shadow:0 6px 14px #0003;font-family:inherit}
#view #head h2{font-family:inherit;text-shadow:0 2px 8px #0003}
#view #head small{color:#ffffffb3}
#view #pal{background:#1f1147e6;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-color:#ffffff33}
#view #grip{background:linear-gradient(135deg,#ff6b6b,#ee5a52)}
#view #grip i{background:#fff}
#ed{z-index:2000}#cf{z-index:2100}
</style>
</head>
<body>
<div id="site">
<div id="fl"><i></i><i></i><i></i></div>
<nav class="navbar-container"><div class="navbar">
  <a href="#" class="navbar-brand" data-go="home"><div class="logo-icon"></div><span class="brand-text">HIMNOS</span></a>
  <ul class="navbar-nav" id="navbarNav"></ul>
  <button class="mobile-toggle" id="mobileToggle" aria-label="Menú"><div class="hamburger"><span></span><span></span><span></span></div></button>
</div></nav>
<div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>
<div class="mobile-menu" id="mobileMenu">
  <div class="mobile-menu-header"><a href="#" class="mobile-menu-brand" data-go="home"><div class="logo-icon"></div><span>HIMNOS</span></a><button class="mobile-menu-close" id="mobileMenuClose">×</button></div>
  <ul class="mobile-menu-nav" id="mnav"></ul>
  <div class="mobile-cta"><a href="#himnario" data-go="canciones" class="mobile-cta-button">Get Started</a></div>
</div>
<section id="home" class="content-section"><h1 class="section-title">Principal</h1></section>
<section id="canciones" class="content-section">
  <h2 class="section-title">Lista de canciones</h2>
  <p class="section-subtitle">Busca por número o título</p>
  <div id="list">
    <div id="top"><div class="acts"><button id="nw">+ Nuevo</button><button id="rf">↻ Actualizar</button></div></div>
    <input id="q" placeholder="Buscar por número o título…" autocomplete="off">
    <div id="cats"></div>
    <div class="rw"><button class="ar l" data-d="-1" aria-label="Anterior">‹</button><div id="items"><div id="msg">Cargando himnos…</div></div><button class="ar r" data-d="1" aria-label="Siguiente">›</button></div>
  </div>
</section>
<section id="himnario" class="content-section"><h2 class="section-title">Himnario</h2></section>
<section id="services" class="content-section"><h2 class="section-title">Services</h2></section>
<section id="portfolio" class="content-section"><h2 class="section-title">Portfolio</h2></section>
<section id="contact" class="content-section"><h2 class="section-title">Contact</h2></section>
</div>
<div id="view">
  <div id="grip" title="Ocultar / mostrar opciones"><i></i></div>
  <div id="bar">
    <div class="seg"><button id="tm" title="Bajar tono">−</button><button id="tl" title="Tono original">0</button><button id="tp" title="Subir tono">+</button></div>
    <button id="chb" class="on">Acordes</button>
    <button id="colb">🎨 Color</button>
    <button id="edit">✎ Editar</button>
  </div>
  <div id="pal"></div>
  <div id="head"></div>
  <div id="wrap"><div id="clip"><div id="box"></div></div></div>
</div>
<div id="cf"><div class="bx"><p id="cft"></p><button id="cf_si">Sí, eliminar</button><button id="cf_no" class="on">No</button></div></div>
<div id="ed"><div class="in">

</div></div>
<script>
const ID="1tO9AsCYWtmDe9mPcU7l7Eo5VF6vS9WJk5xodZw-R2GY";
const URLS=[
 "https://docs.google.com/spreadsheets/d/"+ID+"/gviz/tq?tqx=out:csv&sheet=Hoja%201",
 "https://docs.google.com/spreadsheets/d/"+ID+"/gviz/tq?tqx=out:csv",
 "https://docs.google.com/spreadsheets/d/"+ID+"/export?format=csv&gid=0",
 "https://docs.google.com/spreadsheets/d/e/2PACX-1vTuYxY7rCdH1x_wbM0tXiX0AQOKj2tOiBwJPBTrAE9ulYtnGIWiAyolBqDQTUUJFT94KQ_697S0ncB1/pub?gid=0&single=true&output=csv"];
const $=id=>document.getElementById(id);
const LS=k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},SV=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let sy=0,songs=[],cur=null,semis=0,wl=null,cat="",ovr=null;
const fold=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
const LAYRE=/^\[columnas?\s*[:=]?\s*([12])\]$/i;

function parseCSV(t){const r=[];let row=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==','){row.push(c);c=""}
    else if(ch=='\n'){row.push(c);r.push(row);row=[];c=""}
    else if(ch!='\r')c+=ch}
  if(c||row.length){row.push(c);r.push(row)}return r}

async function load(quiet){
  try{
    let txt=null,err="";
    for(const u of URLS){try{const r=await fetch(u+(u.includes("?")?"&":"?")+"nocache="+Date.now(),{cache:"no-store"});if(!r.ok){err="HTTP "+r.status;continue}
      const t=await r.text();if(t.trim().startsWith("<")){err="La hoja no es pública";continue}txt=t;break}catch(e){err=String(e.message||e)}}
    if(txt===null)throw new Error(err);
    const rows=parseCSV(txt);
    const h=rows[0].map(x=>x.trim().toLowerCase());
    const ix=n=>h.indexOf(n);
    songs=rows.slice(1).map(r=>({num:(r[ix("numero")]||"").trim(),title:(r[ix("titulo")]||"").trim(),tone:(r[ix("tono")]||"").trim(),cat:(r[ix("categoria")]||"").trim(),intro:(r[ix("intro")]||"").trim(),text:(r[ix("letra")]||"").replace(/\r/g,"")})).filter(s=>s.title&&s.text);
    songs.sort((a,b)=>a.num&&!b.num?-1:!a.num&&b.num?1:a.num&&b.num?a.num.localeCompare(b.num,"es",{numeric:true}):a.title.localeCompare(b.title,"es"));
    renderCats();renderList();if(!quiet)route();
  }catch(e){const loc=location.protocol==="file:";
    $("items").innerHTML='<div id="msg">No se pudo leer la hoja ('+esc(e.message)+').<br><br>'+(loc?'Estás abriendo el archivo directamente. Publícalo en Netlify Drop y abre el link que te dé.':'Revisa que la hoja esté compartida como "Cualquier persona con el enlace: Lector".')+'</div>'}
}
function renderCats(){
  const cs=[...new Set(songs.map(s=>s.cat).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));
  if(cat&&!cs.includes(cat))cat="";
  $("cats").innerHTML="";if(!cs.length)return;
  ["",...cs].forEach(c=>{const b=document.createElement("button");b.textContent=c||"Todas";if(c===cat)b.className="on";
    b.onclick=()=>{cat=c;renderCats();renderList()};$("cats").appendChild(b)})}
function renderList(){
  const ws=fold($("q").value).split(" ").filter(Boolean);
  const l=songs.map((s,i)=>[s,i]).filter(([s])=>{if(cat&&s.cat!==cat)return false;const hay=fold(s.num+" "+s.title);return ws.every(w=>hay.includes(w))});
  $("items").innerHTML=l.length?"":'<div id="msg">Sin resultados</div>';
  l.forEach(([s,i])=>{const d=document.createElement("div");d.className="it";
    d.innerHTML=`<div class="tile c${i%8}"><div class="num ${s.num?"":"no"}">${s.num||"♪"}</div></div><div class="tt">${esc(s.title)}</div>${(s.cat||s.tone)?`<small>${esc([s.cat,s.tone?"Tono "+s.tone:""].filter(Boolean).join(" · "))}</small>`:""}`;
    d.onclick=()=>{location.hash=i};$("items").appendChild(d)})}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("q").oninput=renderList;

const CH=/^[A-G][#b]?(m|maj|min|dim|aug|sus|add|M)?\d*(sus\d?|add\d)?(\/[A-G][#b]?)?$/;
const isChordLine=l=>{const t=l.trim().split(/\s+/);return l.trim()&&t.every(x=>x==="|"||x==="/"||x.split("-").every(y=>CH.test(y)))};
const SH=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"],FL=["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
function tr(ch,n,flat){return ch.replace(/[A-G][#b]?/g,m=>{let i=SH.indexOf(m);if(i<0)i=FL.indexOf(m);if(i<0)return m;return(flat?FL:SH)[(i+n+120)%12]})}
function transLine(l,n,flat){if(!n)return l;
  return l.replace(/(\S+)(\s*)/g,(m,c,sp)=>{const t=tr(c,n,flat);const d=t.length-c.length;
    return t+(d>0?sp.slice(Math.min(d,Math.max(sp.length-1,0))):" ".repeat(Math.max(0,sp.length-d)))})}

function build(){
  if(!cur)return;
  let lay=0;
  const lines0=cur.text.split("\n").filter(l=>{const m=l.trim().match(LAYRE);if(m){lay=+m[1];return false}return true});
  cur._lay=lay;
  const flat=/b/.test(lines0.filter(isChordLine).join(" "));
  const secs=[];let s={label:"",lines:[],br:false};
  lines0.forEach(l=>{
    const m=l.trim().match(/^\[(.+)\]$/);
    if(m){if(/^columna$/i.test(m[1])){if(s.lines.length)secs.push(s);s={label:"",lines:[],br:true};return}
      if(s.lines.length||s.label)secs.push(s);s={label:m[1],lines:[],br:false};return}
    s.lines.push(l)});
  secs.push(s);
  const html=[];
  if(cur.intro)html.push(`<div class="sec ci"><div class="lb">Intro</div><pre><span class="c">${esc(transLine(cur.intro,semis,flat))}</span></pre></div>`);
  secs.forEach(x=>{
    while(x.lines.length&&!x.lines[x.lines.length-1].trim())x.lines.pop();
    const blocks=[];let cb=[];
    x.lines.forEach(l=>{if(l.trim())cb.push(l);else if(cb.length){blocks.push(cb);cb=[]}});
    if(cb.length)blocks.push(cb);
    const isCoro=/coro/i.test(x.label);
    blocks.forEach((bl,k)=>{
      const body=bl.map(l=>isChordLine(l)?`<span class="c">${esc(transLine(l,semis,flat))}</span>`:esc(l)).join("\n");
      html.push(`<div class="sec ${x.br&&k==0?"br":""} ${isCoro?"cho":""}">${isCoro&&k==0?`<div class="lb">${esc(x.label)}</div>`:""}<pre>${body}</pre></div>`)})});
  $("box").innerHTML=html.join("");
  $("tl").textContent=(semis>0?"+":"")+semis;
  const tone=cur.tone?tr(cur.tone,semis,flat):"";
  $("head").innerHTML=`${cur.num?`<div class="num">${esc(cur.num)}</div>`:""}<div><h2>${esc(cur.title)}</h2>${tone?`<small>Tono ${esc(tone)}</small>`:""}</div>`;
  layout()}

const box=()=>$("box"),gap=()=>8;
function setCols(n){const b=box();b.style.columnGap=gap()+"px";b.style.columnCount=n}
function fits(){
  const b=box(),c=$("clip").getBoundingClientRect();
  if(c.width<10||c.height<10)return true;
  if(![...b.querySelectorAll("pre")].every(e=>e.scrollWidth<=e.clientWidth+1))return false;
  return [...b.querySelectorAll(".sec")].every(s=>{const q=s.getBoundingClientRect();return q.right<=c.right+1&&q.bottom<=c.bottom+1&&q.left>=c.left-1})}
function fitN(n){const b=box();b.style.transform="none";setCols(n);let lo=4,hi=60;
  while(hi-lo>.3){const m=(lo+hi)/2;b.style.fontSize=m+"px";if(fits())lo=m;else hi=m}return lo}
function layout(){
  if(!cur)return;
  const want=cur._lay||0;
  const b=box();b.style.transform="none";b.style.width="";b.style.margin="0";b.style.setProperty("--lh","1.3");
  let n,f;if(want){n=want;f=fitN(n)}else{const f1=fitN(1),f2=fitN(2);n=f1>f2*1.3?1:2;f=n==1?f1:f2}
  b.classList.toggle("one",n==1);setCols(n);let z=f*.995;b.style.fontSize=z+"px";
  while(!fits()&&z>4){z*=.97;b.style.fontSize=z+"px"}
  let lo=1.3,hi=1.85;
  while(hi-lo>.02){const m=(lo+hi)/2;b.style.setProperty("--lh",m);if(fits())lo=m;else hi=m}
  b.style.setProperty("--lh",lo);
  if(n==2)tighten();
  applyT()}
// junta las dos columnas al ancho real de la letra y las centra, con la línea en medio
function tighten(){const b=box(),pres=[...b.querySelectorAll("pre")];
  pres.forEach(e=>e.style.width="max-content");
  let w=0;pres.forEach(e=>{w=Math.max(w,e.offsetWidth)});
  pres.forEach(e=>e.style.width="");
  const need=(Math.ceil(w)+3)*2+gap();
  if(need<$("clip").clientWidth){b.style.width=need+"px";b.style.margin="0 auto"}}

let Z=1,TX=0,TY=0;
function applyT(){clampPan();box().style.transform=(Z===1&&!TX&&!TY)?"none":`translate(${TX}px,${TY}px) scale(${Z})`}
function clampPan(){const c=$("clip"),W=c.clientWidth,H=c.clientHeight;
  const cl=(v,s)=>{const e=s-s*Z,m=s*.5;return Math.min(Math.max(0,e)+m,Math.max(Math.min(0,e)-m,v))};
  TX=cl(TX,W);TY=cl(TY,H)}
function resetZoom(){Z=1;TX=0;TY=0;if(cur)applyT()}
const W_=$("wrap");let G=null,moved=false,lastTap=0;
const rel=()=>$("clip").getBoundingClientRect();
const dist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
function startG(e){
  if(e.touches.length>=2){const a=e.touches[0],b=e.touches[1],r=rel(),mx=(a.clientX+b.clientX)/2-r.left,my=(a.clientY+b.clientY)/2-r.top;
    G={t:"pinch",d:dist(a,b)||1,z:Z,px:(mx-TX)/Z,py:(my-TY)/Z}}
  else if(e.touches.length===1){const a=e.touches[0];G={t:"pan",x:a.clientX,y:a.clientY,tx:TX,ty:TY}}
  else G=null}
W_.addEventListener("touchstart",e=>{$("pal").classList.remove("open");if(e.touches.length===1)moved=false;else moved=true;startG(e)},{passive:false});
W_.addEventListener("touchmove",e=>{e.preventDefault();if(!G)return;
  if(G.t==="pinch"&&e.touches.length>=2){const a=e.touches[0],b=e.touches[1],r=rel(),mx=(a.clientX+b.clientX)/2-r.left,my=(a.clientY+b.clientY)/2-r.top;
    Z=Math.max(.5,Math.min(6,G.z*dist(a,b)/G.d));TX=mx-G.px*Z;TY=my-G.py*Z;applyT();moved=true}
  else if(G.t==="pan"&&e.touches.length===1){const a=e.touches[0],dx=a.clientX-G.x,dy=a.clientY-G.y;
    if(Math.abs(dx)+Math.abs(dy)>8)moved=true;
    if(Z!==1){TX=G.tx+dx;TY=G.ty+dy;applyT()}}},{passive:false});
function endT(e){
  if(e.touches.length===0){const n=Date.now();
    if(!moved&&G&&G.t==="pan"){if(n-lastTap<300){lastTap=0;resetZoom()}else lastTap=n}
    G=null}
  else startG(e)}
W_.addEventListener("touchend",endT);W_.addEventListener("touchcancel",endT);
W_.addEventListener("wheel",e=>{e.preventDefault();const r=rel(),mx=e.clientX-r.left,my=e.clientY-r.top,px=(mx-TX)/Z,py=(my-TY)/Z;
  Z=Math.max(.5,Math.min(6,Z*Math.exp(-e.deltaY*.0015)));TX=mx-px*Z;TY=my-py*Z;applyT()},{passive:false});
W_.addEventListener("dblclick",resetZoom);
let MD=null;
W_.addEventListener("mousedown",e=>{if(Z!==1)MD={x:e.clientX,y:e.clientY,tx:TX,ty:TY}});
addEventListener("mousemove",e=>{if(MD){TX=MD.tx+e.clientX-MD.x;TY=MD.ty+e.clientY-MD.y;applyT()}});
addEventListener("mouseup",()=>{MD=null});

const COLS={chord:["#e8b04a","#ffffff","#000000","#9aa5a5","#ff6b6b","#5aa9ff","#5fd38d"],
            lyric:["#eef3f1","#ffffff","#000000","#9aa5a5","#e8b04a"],
            bg:["gradient","#0d1b1e","#000000","#ffffff","#2b2f31","#e5e5e5"]};
const NAMES={chord:"Acordes",lyric:"Letra",bg:"Fondo"};
let sel;try{sel=JSON.parse(LS("hcol2")||"null")}catch(e){sel=null}
sel=Object.assign({chord:COLS.chord[0],lyric:COLS.lyric[0],bg:"gradient"},sel||{});
function applyCols(){const v=$("view").style;v.setProperty("--chord",sel.chord);v.setProperty("--lyric",sel.lyric);v.setProperty("--vbg",sel.bg==="gradient"?"transparent":sel.bg)}
function renderPal(){const p=$("pal");p.innerHTML="";
  Object.keys(COLS).forEach(k=>{const r=document.createElement("div");r.className="r";r.innerHTML=`<span>${NAMES[k]}</span>`;
    COLS[k].forEach(c=>{const b=document.createElement("button");b.className="sw"+(sel[k]===c?" on":"");b.style.background=c==="gradient"?"linear-gradient(135deg,#1f1147,#0e7c86)":c;b.title=c;
      b.onclick=()=>{sel[k]=c;SV("hcol2",JSON.stringify(sel));applyCols();renderPal()};r.appendChild(b)});
    p.appendChild(r)})}
$("colb").onclick=()=>{renderPal();$("pal").classList.toggle("open")};
applyCols();

$("tp").onclick=()=>{semis=Math.min(11,semis+1);build()};
$("tm").onclick=()=>{semis=Math.max(-11,semis-1);build()};
$("tl").onclick=()=>{semis=0;build()};
$("chb").onclick=()=>{document.body.classList.toggle("nochords");$("chb").classList.toggle("on");layout()};
$("grip").onclick=()=>{document.body.classList.toggle("min");$("pal").classList.remove("open");layout()};
addEventListener("resize",()=>{if(cur)layout()});

async function keepAwake(on){try{if(on&&navigator.wakeLock)wl=await navigator.wakeLock.request("screen");else if(wl){wl.release();wl=null}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(cur&&document.visibilityState=="visible")keepAwake(true)});

function route(){
  const i=parseInt(location.hash.slice(1));
  $("pal").classList.remove("open");
  if(songs[i]){cur=songs[i];semis=0;Z=1;TX=0;TY=0;ovr=null;sy=scrollY;$("site").style.display="none";$("view").style.display="flex";keepAwake(true);build()}
  else{cur=null;$("view").style.display="none";$("site").style.display="block";scrollTo(0,sy);keepAwake(false)}}
addEventListener("hashchange",route);
$("rf").onclick=()=>{$("items").innerHTML='<div id="msg">Cargando himnos…</div>';load()};
document.fonts&&document.fonts.ready.then(()=>{if(cur)layout()});

// ===== crear / editar =====
const emsg=t=>{$("edmsg").textContent=t};
const norm=t=>(t||"").replace(/\s+/g," ").trim();
let edOrig=null;
const edOpen=()=>$("ed").style.display==="block";
addEventListener("popstate",()=>{if(edOpen())$("ed").style.display="none"});
function closeEd(then){
  if(history.state&&history.state.ed){
    const f=()=>{removeEventListener("popstate",f);then&&then()};
    addEventListener("popstate",f);history.back()}
  else{$("ed").style.display="none";then&&then()}}
function openEd(x){edOrig=x||null;$("e_del").style.display=x?"inline-block":"none";
  $("cl").innerHTML=[...new Set(songs.map(z=>z.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("");
  $("edt").textContent=x?"Editar himno":"Nuevo himno";
  x=x||{num:"",title:"",cat:"",tone:"",intro:"",text:""};
  let lay=0;
  const txt=x.text.split("\n").filter(l=>{const m=l.trim().match(LAYRE);if(m){lay=+m[1];return false}return true}).join("\n");
  $("e_num").value=x.num;$("e_ton").value=x.tone;$("e_tit").value=x.title;$("e_cat").value=x.cat;$("e_int").value=x.intro;$("e_let").value=txt;$("e_lay").value=lay;
  $("e_url").value=LS("hurl");$("e_key").value=LS("hkey");$("cn").open=!LS("hurl");
  emsg("");$("ed").style.display="block";$("ed").scrollTop=0;
  history.pushState({ed:1},"")}
$("nw").onclick=()=>openEd();
$("edit").onclick=()=>cur&&openEd(cur);
$("e_x").onclick=()=>closeEd();
document.querySelectorAll(".tb button").forEach(b=>b.onclick=()=>{const a=$("e_let"),s=a.selectionStart,pre=s>0&&a.value[s-1]!=="\n"?"\n":"";
  a.setRangeText(pre+b.dataset.i+"\n",s,a.selectionEnd,"end");a.focus()});

function dupMsg(d){const o=edOrig;
  for(const z of songs){
    if(o&&z.num===o.num&&z.title===o.title)continue;
    if(d.numero&&z.num&&fold(z.num)===fold(d.numero))return "Ya existe un himno con el número "+z.num+" («"+z.title+"»). Usa otro número.";
    if(fold(z.title)===fold(d.titulo))return "Ya existe un himno con el nombre «"+z.title+"»"+(z.num?" (n.º "+z.num+")":"")+". Usa otro nombre."}
  return ""}
async function post(url,d){
  const opt={method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)};
  try{const r=await fetch(url,opt);return (await r.text()).trim()}
  catch(e){await fetch(url,{...opt,mode:"no-cors"});return null}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const delData=(o,key)=>({accion:"borrar",clave:key,numero:o.num,titulo:o.title,categoria:o.cat,tono:o.tone,intro:o.intro,letra:o.text});

$("e_save").onclick=async()=>{
  const lay=$("e_lay").value;
  let letra=$("e_let").value.replace(/\r/g,"");
  if(lay!=="0")letra="[Columnas:"+lay+"]\n"+letra;
  const d={numero:$("e_num").value.trim(),titulo:$("e_tit").value.trim(),categoria:$("e_cat").value.trim(),tono:$("e_ton").value.trim(),intro:$("e_int").value.trim(),letra};
  const url=$("e_url").value.trim(),key=$("e_key").value.trim();
  if(!d.titulo||!$("e_let").value.trim())return emsg("Falta el título o la letra.");
  if(!url){$("cn").open=true;return emsg("Falta pegar el enlace de conexión.")}
  const dm=dupMsg(d);if(dm)return emsg(dm);
  SV("hurl",url);SV("hkey",key);d.clave=key;
  const o=edOrig,renamed=o&&(o.num!==d.numero||o.title!==d.titulo);
  $("e_save").disabled=true;emsg("Guardando…");
  const fail=t=>{$("e_save").disabled=false;emsg(t)};
  let resp;
  try{resp=await post(url,d)}catch(e2){return fail("No se pudo enviar: "+e2.message+". Revisa el enlace y tu internet.")}
  if(resp!==null&&resp!=="ok"){
    if(resp==="clave incorrecta")return fail("La clave no coincide con la que pusiste en el script.");
    return fail("El script respondió algo inesperado: "+resp.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,160))}
  emsg("Enviado. Leyendo la hoja…");
  const same=z=>z.title===d.titulo&&(!d.numero||z.num===d.numero)&&(resp==="ok"||norm(z.text)===norm(d.letra));
  let k=-1;
  for(let i=0;i<5&&k<0;i++){await wait(1500);await load(true);k=songs.findIndex(same)}
  if(k<0)return fail(resp==="ok"
    ?"El script confirmó que se guardó, pero la página todavía no lo ve al leer la hoja. Espera un minuto y pulsa ↻ Actualizar."
    :"No pude confirmar que se guardó. Revisa el enlace /exec, que el acceso sea «Cualquier persona» y que la clave sea la misma.");
  if(renamed){ // se cambió número o nombre: quitar la versión vieja para que no quede duplicada
    emsg("Quitando la versión anterior…");
    if(songs.some(z=>z.num===o.num&&z.title===o.title)){
      try{await post(url,delData(o,key))}catch(e){}
      await wait(1500);await load(true);
      if(songs.findIndex(same)<0){emsg("Restaurando…");await post(url,d);await wait(1500);await load(true)}}
    k=songs.findIndex(same)}
  emsg("✓ Guardado en Google Sheets");$("e_save").disabled=false;
  setTimeout(()=>closeEd(()=>{if(k>=0&&location.hash==="#"+k)route();else if(k>=0)location.hash=k;else{location.hash="";route()}}),600)};

const ask=t=>new Promise(r=>{$("cft").textContent=t;$("cf").style.display="flex";
  $("cf_si").onclick=()=>{$("cf").style.display="none";r(true)};$("cf_no").onclick=()=>{$("cf").style.display="none";r(false)}});
$("e_del").onclick=async()=>{
  if(!edOrig)return;
  const url=$("e_url").value.trim(),key=$("e_key").value.trim(),o=edOrig;
  if(!url){$("cn").open=true;return emsg("Falta pegar el enlace de conexión.")}
  if(!await ask("¿Seguro que quieres eliminar el himno «"+o.title+"»?"))return;
  $("e_del").disabled=true;emsg("Borrando…");
  const end=t=>{$("e_del").disabled=false;emsg(t)};
  let resp;
  try{resp=await post(url,delData(o,key))}
  catch(e){return end("No se pudo enviar: "+e.message)}
  if(resp==="clave incorrecta")return end("La clave no coincide con la que pusiste en el script.");
  if(resp==="no encontrado")return end("No encontré ese himno en la hoja. Quizás ya lo borraste; pulsa ↻ Actualizar.");
  if(resp!==null&&resp!=="ok")return end("El script respondió algo inesperado: "+resp.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,160));
  emsg("Verificando…");
  for(let i=0;i<5;i++){
    await wait(1500);await load(true);
    if(!songs.some(z=>z.title===o.title&&z.num===o.num)){
      emsg("✓ Himno borrado");$("e_del").disabled=false;
      setTimeout(()=>closeEd(()=>{if(location.hash)location.hash="";else route()}),600);return}}
  end("El himno sigue en la hoja. Lo más probable es que el script sea la versión vieja: pega el script nuevo y publícalo como Nueva versión.")};

$("navbarNav").innerHTML=NAV.map(([id,t,ic],k)=>`<li><a href="#${id}" data-go="${id}" class="nav-link${k?"":" active"}"><svg class="nav-icon" viewBox="0 0 24 24">${ic}</svg><span>${t}</span></a></li>`).join("")+'<li><a href="#canciones" data-go="canciones" class="cta-button">Get Started</a></li>';
$("mnav").innerHTML=NAV.map(([id,t,ic],k)=>`<li><a href="#${id}" data-go="${id}" class="mobile-menu-link${k?"":" active"}"><svg class="mobile-menu-icon" viewBox="0 0 24 24">${ic}</svg><span>${t}</span></a></li>`).join("");
const mm=$("mobileMenu"),mo=$("mobileMenuOverlay"),mt=$("mobileToggle");
function openM(o){[mm,mo,mt].forEach(x=>x.classList.toggle("active",o));document.body.style.overflow=o?"hidden":""}
const closeM=()=>openM(false);
mt.onclick=()=>openM(!mm.classList.contains("active"));$("mobileMenuClose").onclick=closeM;mo.onclick=closeM;
document.addEventListener("click",e=>{const a=e.target.closest("[data-go]");if(!a)return;e.preventDefault();closeM();const t=$(a.dataset.go);t&&t.scrollIntoView({behavior:"smooth"})});
function setActive(id){document.querySelectorAll(".nav-link,.mobile-menu-link").forEach(a=>a.classList.toggle("active",a.dataset.go===id))}
if("IntersectionObserver"in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setActive(e.target.id)}),{rootMargin:"-45% 0px -50% 0px"});NAV.forEach(n=>io.observe($(n[0])))}
document.querySelectorAll(".ar").forEach(b=>b.onclick=()=>{const it=$("items");it.scrollBy({left:b.dataset.d*it.clientWidth*.8,behavior:"smooth"})});
