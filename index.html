<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Himnario</title>
<style>
:root{--side:clamp(6px,2vw,24px);--bg:#0d1b1e;--card:#12262a;--btn:#1e3438;--tx:#eef3f1;--mut:#7fa0a0;--gold:#e8b04a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
button,input{font:inherit;color:var(--tx)}
button{background:var(--btn);border:0;border-radius:8px;padding:10px 14px;cursor:pointer;min-height:42px}
button.on{color:var(--gold)}
#list{max-width:720px;margin:0 auto;padding:16px}
h1{font-family:Georgia,serif;color:var(--gold);margin:8px 0 12px}
#q{width:100%;padding:12px;border-radius:8px;border:1px solid var(--btn);background:var(--card);margin-bottom:12px}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.num{min-width:64px;text-align:center;font:700 22px Georgia,serif;color:var(--gold);background:#0a1416;border-radius:8px;padding:8px}
.num.no{color:var(--mut);font-size:20px}
.it small{color:var(--mut);display:block}
#view{display:none;height:100dvh;flex-direction:column;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;background:var(--bg)}
/* lengüeta lateral para ocultar / mostrar el menú */
#grip{position:fixed;right:0;top:50%;transform:translateY(-50%);width:16px;height:64px;display:flex;align-items:center;justify-content:center;background:#0d1b1eb0;border-radius:10px 0 0 10px;cursor:pointer;z-index:12}
#grip i{width:4px;height:28px;border-radius:3px;background:var(--mut);opacity:.85}
body.min #grip{background:#0d1b1e60}
body.min #grip i{opacity:.5}
body.min #bar,body.min #head,body.min #pal{display:none}
#bar{display:flex;align-items:center;gap:6px;padding:calc(4px + env(safe-area-inset-top,0px)) 8px 6px;border-bottom:1px solid var(--btn);overflow-x:auto;scrollbar-width:none;background:var(--bg)}
#bar::-webkit-scrollbar{display:none}
#bar button{min-height:28px;padding:3px 11px;font-size:13px;border-radius:999px;background:transparent;border:1px solid #2a4448;white-space:nowrap;flex:none}
#bar button.on{color:var(--gold);border-color:var(--gold)}
.seg{display:flex;flex:none;border:1px solid #2a4448;border-radius:999px;overflow:hidden}
#bar .seg button{border:0;border-radius:0;min-width:32px;padding:3px 9px}
#bar .seg button+button{border-left:1px solid #2a4448}
#edit{margin-left:auto}
#head{display:flex;align-items:center;gap:12px;padding:6px 14px;background:var(--bg)}
#head .num{font-size:26px}
#head h2{margin:0;font:700 clamp(18px,3.5vw,30px) Georgia,serif}
#head small{color:var(--mut)}
#wrap{flex:1;min-height:0;position:relative;padding:6px var(--side) 12px;touch-action:none;overflow:hidden;background:var(--vbg,var(--bg))}
body.min #wrap{padding-top:calc(6px + env(safe-area-inset-top,0px))}
#clip{height:100%;overflow:hidden}
#box{height:100%;overflow:visible;column-rule:1px solid #2a4448;column-gap:32px;column-fill:balance;transform-origin:0 0;will-change:transform;color:var(--lyric,var(--tx))}
.sec{break-inside:avoid;margin-bottom:.8em}
.sec.br{break-before:column}
.lb{font:italic 600 .8em Georgia,serif;color:var(--mut);margin-bottom:2px}
pre{margin:0;font-family:Arimo,Arial,"Liberation Sans",Helvetica,sans-serif;white-space:pre;line-height:var(--lh,1.3)}
pre .c{color:var(--chord,var(--gold))}
.sec.cho pre{border-left:3px solid var(--gold);padding-left:8px}
body.nochords .c{display:none}
/* panel de colores */
#pal{display:none;position:fixed;left:8px;top:calc(46px + env(safe-area-inset-top,0px));z-index:15;background:var(--card);border:1px solid #2a4448;border-radius:14px;padding:8px 12px;box-shadow:0 8px 24px #0009}
#pal.open{display:block}
#pal .r{display:flex;align-items:center;gap:8px;margin:6px 0}
#pal .r>span{width:58px;font-size:12px;color:var(--mut)}
.sw{width:26px;height:26px;min-height:0;padding:0;border-radius:50%;border:1px solid #4a6d72}
.sw.on{outline:2px solid var(--gold);outline-offset:2px}
#cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
#cats button{min-height:34px;padding:6px 12px;font-size:14px}
body.nochords .ci{display:none}
#ed{display:none;position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20;padding:16px}
#ed .in{max-width:720px;margin:0 auto}
#ed label{display:block;color:var(--mut);font-size:13px;margin:10px 0 4px}
#ed input,#ed textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--btn);background:var(--card)}
#ed textarea{font-family:Arimo,Arial,sans-serif;min-height:300px;white-space:pre;overflow:auto}
#ed .row{display:flex;gap:8px}#ed .row>div{flex:1}
#ed details{margin-top:14px;color:var(--mut)}
#cf{display:none;position:fixed;inset:0;background:#000c;z-index:40;align-items:center;justify-content:center;padding:20px}
#cf .bx{background:var(--card);border-radius:14px;padding:22px;max-width:400px;text-align:center}
#cf p{margin:0 0 18px;font-size:19px;line-height:1.35}
#cf button{min-width:110px;margin:0 6px}
#cf_si{color:#ff8a80}
#e_del{color:#ff8a80;float:right}
#edmsg{margin:12px 0;color:var(--gold);min-height:1.3em}
#msg{padding:24px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<div id="list">
  <h1>Himnario <button id="rf" style="font-size:14px;float:right">↻ Actualizar</button><button id="nw" style="font-size:14px;float:right;margin-right:8px">+ Nuevo</button></h1>
  <input id="q" placeholder="Buscar por número o título…" autocomplete="off">
  <div id="cats"></div>
  <div id="items"><div id="msg">Cargando himnos…</div></div>
</div>
<div id="view">
  <div id="grip" title="Ocultar / mostrar opciones"><i></i></div>
  <div id="bar">
    <div class="seg"><button id="tm" title="Bajar tono">−</button><button id="tl" title="Tono original">0</button><button id="tp" title="Subir tono">+</button></div>
    <button id="chb" class="on">Acordes</button>
    <button id="colb">🎨 Color</button>
    <button id="edit">✎ Editar</button>
  </div>
  <div id="pal"></div>
  <div id="head"></div>
  <div id="wrap"><div id="clip"><div id="box"></div></div></div>
</div>
<div id="cf"><div class="bx"><p id="cft"></p><button id="cf_si">Sí, eliminar</button><button id="cf_no" class="on">No</button></div></div>
<div id="ed"><div class="in">
  <h1 id="edt">Nuevo himno</h1>
  <div class="row"><div><label>Número</label><input id="e_num" placeholder="S-105"></div><div><label>Tono</label><input id="e_ton" placeholder="Dm"></div></div>
  <label>Título</label><input id="e_tit">
  <label>Categoría (opcional)</label><input id="e_cat" list="cl"><datalist id="cl"></datalist>
  <label>Intro: acordes (opcional, déjalo vacío si no lleva)</label><input id="e_int" placeholder="Dm Bb F A7">
  <label>Letra con acordes (línea de acordes encima de la letra; usa [Coro] o [Estrofa 2] para etiquetas)</label>
  <textarea id="e_let" wrap="off" spellcheck="false"></textarea>
  <details id="cn"><summary>⚙ Conexión con Google Sheets</summary>
    <label>Enlace de la aplicación web (Apps Script)</label><input id="e_url" placeholder="https://script.google.com/macros/s/.../exec">
    <label>Clave</label><input id="e_key" type="password"></details>
  <div id="edmsg"></div>
  <button id="e_save" class="on">Guardar en Google Sheets</button> <button id="e_x">Cancelar</button> <button id="e_del" style="display:none">🗑 Borrar himno</button>
</div></div>
<script>
// ====== CONFIGURACIÓN: tu hoja publicada como CSV ======
const ID="1tO9AsCYWtmDe9mPcU7l7Eo5VF6vS9WJk5xodZw-R2GY";
const URLS=[
 "https://docs.google.com/spreadsheets/d/"+ID+"/gviz/tq?tqx=out:csv&sheet=Hoja%201",
 "https://docs.google.com/spreadsheets/d/"+ID+"/gviz/tq?tqx=out:csv",
 "https://docs.google.com/spreadsheets/d/"+ID+"/export?format=csv&gid=0",
 "https://docs.google.com/spreadsheets/d/e/2PACX-1vTuYxY7rCdH1x_wbM0tXiX0AQOKj2tOiBwJPBTrAE9ulYtnGIWiAyolBqDQTUUJFT94KQ_697S0ncB1/pub?gid=0&single=true&output=csv"];
// =======================================================
const $=id=>document.getElementById(id);
const LS=k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},SV=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let songs=[],cur=null,semis=0,wl=null,cat="";

function parseCSV(t){const r=[];let row=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==','){row.push(c);c=""}
    else if(ch=='\n'){row.push(c);r.push(row);row=[];c=""}
    else if(ch!='\r')c+=ch}
  if(c||row.length){row.push(c);r.push(row)}return r}

async function load(quiet){
  try{
    let txt=null,err="";
    for(const u of URLS){try{const r=await fetch(u+(u.includes("?")?"&":"?")+"nocache="+Date.now(),{cache:"no-store"});if(!r.ok){err="HTTP "+r.status;continue}
      const t=await r.text();if(t.trim().startsWith("<")){err="La hoja no es pública";continue}txt=t;break}catch(e){err=String(e.message||e)}}
    if(txt===null)throw new Error(err);
    const rows=parseCSV(txt);
    const h=rows[0].map(x=>x.trim().toLowerCase());
    const ix=n=>h.indexOf(n);
    songs=rows.slice(1).map(r=>({num:(r[ix("numero")]||"").trim(),title:(r[ix("titulo")]||"").trim(),tone:(r[ix("tono")]||"").trim(),cat:(r[ix("categoria")]||"").trim(),intro:(r[ix("intro")]||"").trim(),text:(r[ix("letra")]||"").replace(/\r/g,"")})).filter(s=>s.title&&s.text);
    songs.sort((a,b)=>a.num&&!b.num?-1:!a.num&&b.num?1:a.num&&b.num?a.num.localeCompare(b.num,"es",{numeric:true}):a.title.localeCompare(b.title,"es"));
    renderCats();renderList();if(!quiet)route();
  }catch(e){const loc=location.protocol==="file:";
    $("items").innerHTML='<div id="msg">No se pudo leer la hoja ('+esc(e.message)+').<br><br>'+(loc?'Estás abriendo el archivo directamente. Publícalo en Netlify Drop y abre el link que te dé.':'Revisa que la hoja esté compartida como "Cualquier persona con el enlace: Lector".')+'</div>'}
}
function renderCats(){
  const cs=[...new Set(songs.map(s=>s.cat).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));
  if(cat&&!cs.includes(cat))cat="";
  $("cats").innerHTML="";if(!cs.length)return;
  ["",...cs].forEach(c=>{const b=document.createElement("button");b.textContent=c||"Todas";if(c===cat)b.className="on";
    b.onclick=()=>{cat=c;renderCats();renderList()};$("cats").appendChild(b)})}
function renderList(){
  const f=$("q").value.toLowerCase().trim();
  const l=songs.map((s,i)=>[s,i]).filter(([s])=>(!cat||s.cat===cat)&&(!f||s.title.toLowerCase().includes(f)||s.num.toLowerCase().includes(f)));
  $("items").innerHTML=l.length?"":'<div id="msg">Sin resultados</div>';
  l.forEach(([s,i])=>{const d=document.createElement("div");d.className="it";
    d.innerHTML=`<div class="num ${s.num?"":"no"}">${s.num||"♪"}</div><div>${esc(s.title)}${(s.cat||s.tone)?`<small>${esc([s.cat,s.tone?"Tono "+s.tone:""].filter(Boolean).join(" · "))}</small>`:""}</div>`;
    d.onclick=()=>{location.hash=i};$("items").appendChild(d)})}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("q").oninput=renderList;

// ===== acordes =====
const CH=/^[A-G][#b]?(m|maj|min|dim|aug|sus|add|M)?\d*(sus\d?|add\d)?(\/[A-G][#b]?)?$/;
const isChordLine=l=>{const t=l.trim().split(/\s+/);return l.trim()&&t.every(x=>x==="|"||x==="/"||x.split("-").every(y=>CH.test(y)))};
const SH=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"],FL=["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
function tr(ch,n,flat){return ch.replace(/[A-G][#b]?/g,m=>{let i=SH.indexOf(m);if(i<0)i=FL.indexOf(m);if(i<0)return m;return(flat?FL:SH)[(i+n+120)%12]})}
function transLine(l,n,flat){if(!n)return l;
  return l.replace(/(\S+)(\s*)/g,(m,c,sp)=>{const t=tr(c,n,flat);const d=t.length-c.length;
    return t+(d>0?sp.slice(Math.min(d,Math.max(sp.length-1,0))):" ".repeat(Math.max(0,sp.length-d)))})}

function build(){
  if(!cur)return;
  const flat=/b/.test(cur.text.split("\n").filter(isChordLine).join(" "));
  const secs=[];let s={label:"",lines:[],br:false};
  cur.text.split("\n").forEach(l=>{
    const m=l.trim().match(/^\[(.+)\]$/);
    if(m){if(/^columna$/i.test(m[1])){if(s.lines.length)secs.push(s);s={label:"",lines:[],br:true};return}
      if(s.lines.length||s.label)secs.push(s);s={label:m[1],lines:[],br:false};return}
    s.lines.push(l)});
  secs.push(s);
  const html=[];
  if(cur.intro)html.push(`<div class="sec ci"><div class="lb">Intro</div><pre><span class="c">${esc(transLine(cur.intro,semis,flat))}</span></pre></div>`);
  secs.forEach(x=>{
    while(x.lines.length&&!x.lines[x.lines.length-1].trim())x.lines.pop();
    const blocks=[];let cb=[];
    x.lines.forEach(l=>{if(l.trim())cb.push(l);else if(cb.length){blocks.push(cb);cb=[]}});
    if(cb.length)blocks.push(cb);
    const isCoro=/coro/i.test(x.label);
    blocks.forEach((bl,k)=>{
      const body=bl.map(l=>isChordLine(l)?`<span class="c">${esc(transLine(l,semis,flat))}</span>`:esc(l)).join("\n");
      html.push(`<div class="sec ${x.br&&k==0?"br":""} ${isCoro?"cho":""}">${isCoro&&k==0?`<div class="lb">${esc(x.label)}</div>`:""}<pre>${body}</pre></div>`)})});
  $("box").innerHTML=html.join("");
  $("tl").textContent=(semis>0?"+":"")+semis;
  const tone=cur.tone?tr(cur.tone,semis,flat):"";
  $("head").innerHTML=`${cur.num?`<div class="num">${esc(cur.num)}</div>`:""}<div><h2>${esc(cur.title)}</h2>${tone?`<small>Tono ${esc(tone)}</small>`:""}</div>`;
  layout()}

// ===== ajuste: el himno siempre cabe COMPLETO en una sola pantalla, lo más grande posible =====
const box=()=>$("box"),gap=()=>30;
function setCols(n){const b=box();b.style.columnGap=gap()+"px";b.style.columnCount=n}
function fits(){
  const b=box(),c=$("clip").getBoundingClientRect();
  if(c.width<10||c.height<10)return true;
  if(![...b.querySelectorAll("pre")].every(e=>e.scrollWidth<=e.clientWidth+1))return false;
  return [...b.querySelectorAll(".sec")].every(s=>{const q=s.getBoundingClientRect();return q.right<=c.right+1&&q.bottom<=c.bottom+1&&q.left>=c.left-1})}
function fitN(n){const b=box();b.style.transform="none";setCols(n);let lo=4,hi=60;
  while(hi-lo>.3){const m=(lo+hi)/2;b.style.fontSize=m+"px";if(fits())lo=m;else hi=m}return lo}
function layout(){
  if(!cur)return;
  const b=box();b.style.transform="none";b.style.setProperty("--lh","1.3");
  const f1=fitN(1),f2=fitN(2),n=f1>f2*1.3?1:2,f=n==1?f1:f2;
  setCols(n);let z=f*.995;b.style.fontSize=z+"px";
  while(!fits()&&z>4){z*=.97;b.style.fontSize=z+"px"}
  let lo=1.3,hi=1.85;
  while(hi-lo>.02){const m=(lo+hi)/2;b.style.setProperty("--lh",m);if(fits())lo=m;else hi=m}
  b.style.setProperty("--lh",lo);
  applyT()}

// ===== zoom con dos dedos (pellizcar), mover con un dedo, doble toque = restablecer =====
let Z=1,TX=0,TY=0;
function applyT(){clampPan();box().style.transform=(Z===1&&!TX&&!TY)?"none":`translate(${TX}px,${TY}px) scale(${Z})`}
function clampPan(){const c=$("clip"),W=c.clientWidth,H=c.clientHeight;
  const cl=(v,s)=>{const e=s-s*Z;return Math.min(Math.max(0,e),Math.max(Math.min(0,e),v))};
  TX=cl(TX,W);TY=cl(TY,H)}
function resetZoom(){Z=1;TX=0;TY=0;if(cur)applyT()}
const W_=$("wrap");let G=null,moved=false,lastTap=0;
const rel=()=>$("clip").getBoundingClientRect();
const dist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
function startG(e){
  if(e.touches.length>=2){const a=e.touches[0],b=e.touches[1],r=rel(),mx=(a.clientX+b.clientX)/2-r.left,my=(a.clientY+b.clientY)/2-r.top;
    G={t:"pinch",d:dist(a,b)||1,z:Z,px:(mx-TX)/Z,py:(my-TY)/Z}}
  else if(e.touches.length===1){const a=e.touches[0];G={t:"pan",x:a.clientX,y:a.clientY,tx:TX,ty:TY}}
  else G=null}
W_.addEventListener("touchstart",e=>{$("pal").classList.remove("open");if(e.touches.length===1)moved=false;else moved=true;startG(e)},{passive:false});
W_.addEventListener("touchmove",e=>{e.preventDefault();if(!G)return;
  if(G.t==="pinch"&&e.touches.length>=2){const a=e.touches[0],b=e.touches[1],r=rel(),mx=(a.clientX+b.clientX)/2-r.left,my=(a.clientY+b.clientY)/2-r.top;
    Z=Math.max(.5,Math.min(6,G.z*dist(a,b)/G.d));TX=mx-G.px*Z;TY=my-G.py*Z;applyT();moved=true}
  else if(G.t==="pan"&&e.touches.length===1){const a=e.touches[0],dx=a.clientX-G.x,dy=a.clientY-G.y;
    if(Math.abs(dx)+Math.abs(dy)>8)moved=true;
    if(Z!==1){TX=G.tx+dx;TY=G.ty+dy;applyT()}}},{passive:false});
function endT(e){
  if(e.touches.length===0){const n=Date.now();
    if(!moved&&G&&G.t==="pan"){if(n-lastTap<300){lastTap=0;resetZoom()}else lastTap=n}
    G=null}
  else startG(e)}
W_.addEventListener("touchend",endT);W_.addEventListener("touchcancel",endT);
// rueda del ratón (computador): acerca / aleja
W_.addEventListener("wheel",e=>{e.preventDefault();const r=rel(),mx=e.clientX-r.left,my=e.clientY-r.top,px=(mx-TX)/Z,py=(my-TY)/Z;
  Z=Math.max(.5,Math.min(6,Z*Math.exp(-e.deltaY*.0015)));TX=mx-px*Z;TY=my-py*Z;applyT()},{passive:false});
W_.addEventListener("dblclick",resetZoom);

// ===== colores (acordes, letra, fondo) =====
const COLS={chord:["#e8b04a","#ffffff","#000000","#9aa5a5","#ff6b6b","#5aa9ff","#5fd38d"],
            lyric:["#eef3f1","#ffffff","#000000","#9aa5a5","#e8b04a"],
            bg:["#0d1b1e","#000000","#ffffff","#2b2f31","#e5e5e5"]};
const NAMES={chord:"Acordes",lyric:"Letra",bg:"Fondo"};
let sel;try{sel=JSON.parse(LS("hcol")||"null")}catch(e){sel=null}
sel=Object.assign({chord:COLS.chord[0],lyric:COLS.lyric[0],bg:COLS.bg[0]},sel||{});
function applyCols(){const v=$("view").style;v.setProperty("--chord",sel.chord);v.setProperty("--lyric",sel.lyric);v.setProperty("--vbg",sel.bg)}
function renderPal(){const p=$("pal");p.innerHTML="";
  Object.keys(COLS).forEach(k=>{const r=document.createElement("div");r.className="r";r.innerHTML=`<span>${NAMES[k]}</span>`;
    COLS[k].forEach(c=>{const b=document.createElement("button");b.className="sw"+(sel[k]===c?" on":"");b.style.background=c;b.title=c;
      b.onclick=()=>{sel[k]=c;SV("hcol",JSON.stringify(sel));applyCols();renderPal()};r.appendChild(b)});
    p.appendChild(r)})}
$("colb").onclick=()=>{renderPal();$("pal").classList.toggle("open")};
applyCols();

// ===== botones =====
$("tp").onclick=()=>{semis=Math.min(11,semis+1);build()};
$("tm").onclick=()=>{semis=Math.max(-11,semis-1);build()};
$("tl").onclick=()=>{semis=0;build()};
$("chb").onclick=()=>{document.body.classList.toggle("nochords");$("chb").classList.toggle("on");layout()};
$("grip").onclick=()=>{document.body.classList.toggle("min");$("pal").classList.remove("open");layout()};
addEventListener("resize",()=>{if(cur)layout()});

async function keepAwake(on){try{if(on&&navigator.wakeLock)wl=await navigator.wakeLock.request("screen");else if(wl){wl.release();wl=null}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(cur&&document.visibilityState=="visible")keepAwake(true)});

function route(){
  const i=parseInt(location.hash.slice(1));
  $("pal").classList.remove("open");
  if(songs[i]){cur=songs[i];semis=0;Z=1;TX=0;TY=0;$("list").style.display="none";$("view").style.display="flex";keepAwake(true);build()}
  else{cur=null;$("view").style.display="none";$("list").style.display="block";keepAwake(false)}}
addEventListener("hashchange",route);
$("rf").onclick=()=>{$("items").innerHTML='<div id="msg">Cargando himnos…</div>';load()};
document.fonts&&document.fonts.ready.then(()=>{if(cur)layout()});

// ===== crear / editar himnos y guardarlos en Google Sheets =====
const emsg=t=>{$("edmsg").textContent=t};
const norm=t=>(t||"").replace(/\s+/g," ").trim();
let edOrig=null;
const edOpen=()=>$("ed").style.display==="block";
// el gesto "atrás" del celular cierra el editor (igual que Cancelar)
addEventListener("popstate",()=>{if(edOpen())$("ed").style.display="none"});
function closeEd(then){
  if(history.state&&history.state.ed){
    const f=()=>{removeEventListener("popstate",f);then&&then()};
    addEventListener("popstate",f);history.back()}
  else{$("ed").style.display="none";then&&then()}}
function openEd(x){edOrig=x||null;$("e_del").style.display=x?"inline-block":"none";
  $("cl").innerHTML=[...new Set(songs.map(z=>z.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("");
  $("edt").textContent=x?"Editar himno":"Nuevo himno";
  x=x||{num:"",title:"",cat:"",tone:"",intro:"",text:""};
  $("e_num").value=x.num;$("e_ton").value=x.tone;$("e_tit").value=x.title;$("e_cat").value=x.cat;$("e_int").value=x.intro;$("e_let").value=x.text;
  $("e_url").value=LS("hurl");$("e_key").value=LS("hkey");$("cn").open=!LS("hurl");
  emsg("");$("ed").style.display="block";$("ed").scrollTop=0;
  history.pushState({ed:1},"")}
$("nw").onclick=()=>openEd();
$("edit").onclick=()=>cur&&openEd(cur);
$("e_x").onclick=()=>closeEd();
$("e_save").onclick=async()=>{
  const d={numero:$("e_num").value.trim(),titulo:$("e_tit").value.trim(),categoria:$("e_cat").value.trim(),tono:$("e_ton").value.trim(),intro:$("e_int").value.trim(),letra:$("e_let").value.replace(/\r/g,"")};
  const url=$("e_url").value.trim(),key=$("e_key").value.trim();
  if(!d.titulo||!d.letra.trim())return emsg("Falta el título o la letra.");
  if(!url){$("cn").open=true;return emsg("Falta pegar el enlace de conexión.")}
  SV("hurl",url);SV("hkey",key);d.clave=key;
  $("e_save").disabled=true;emsg("Guardando…");
  const opt={method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)};
  const fail=t=>{$("e_save").disabled=false;emsg(t)};
  let resp=null;
  try{const r=await fetch(url,opt);resp=(await r.text()).trim()}
  catch(e){try{await fetch(url,{...opt,mode:"no-cors"})}catch(e2){return fail("No se pudo enviar: "+e2.message+". Revisa el enlace y tu internet.")}}
  if(resp!==null&&resp!=="ok"){
    if(resp==="clave incorrecta")return fail("La clave no coincide con la que pusiste en el script.");
    return fail("El script respondió algo inesperado: "+resp.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,160));}
  emsg("Enviado. Leyendo la hoja…");
  const same=z=>z.title===d.titulo&&(!d.numero||z.num===d.numero)&&(resp==="ok"||norm(z.text)===norm(d.letra));
  for(let i=0;i<5;i++){
    await new Promise(r=>setTimeout(r,1500));await load(true);
    const k=songs.findIndex(same);
    if(k>=0){emsg("✓ Guardado en Google Sheets");$("e_save").disabled=false;
      setTimeout(()=>closeEd(()=>{if(location.hash==="#"+k)route();else location.hash=k}),600);return}}
  fail(resp==="ok"
    ?"El script confirmó que se guardó, pero la página todavía no lo ve al leer la hoja. Espera un minuto y pulsa ↻ Actualizar. Si no aparece, revisa que la hoja que lee la página sea la primera pestaña."
    :"No pude confirmar que se guardó. Abre el enlace /exec en una ventana privada: debe cargar sin pedirte iniciar sesión. Revisa también que el acceso sea «Cualquier persona» y que la clave sea la misma.")};
const ask=t=>new Promise(r=>{$("cft").textContent=t;$("cf").style.display="flex";
  $("cf_si").onclick=()=>{$("cf").style.display="none";r(true)};$("cf_no").onclick=()=>{$("cf").style.display="none";r(false)}});
async function post(url,d){
  const opt={method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)};
  try{const r=await fetch(url,opt);return (await r.text()).trim()}
  catch(e){await fetch(url,{...opt,mode:"no-cors"});return null}}
$("e_del").onclick=async()=>{
  if(!edOrig)return;
  const url=$("e_url").value.trim(),key=$("e_key").value.trim(),o=edOrig;
  if(!url){$("cn").open=true;return emsg("Falta pegar el enlace de conexión.")}
  if(!await ask("¿Seguro que quieres eliminar el himno «"+o.title+"»?"))return;
  $("e_del").disabled=true;emsg("Borrando…");
  const end=t=>{$("e_del").disabled=false;emsg(t)};
  let resp;
  try{resp=await post(url,{accion:"borrar",clave:key,numero:o.num,titulo:o.title,categoria:o.cat,tono:o.tone,intro:o.intro,letra:o.text})}
  catch(e){return end("No se pudo enviar: "+e.message)}
  if(resp==="clave incorrecta")return end("La clave no coincide con la que pusiste en el script.");
  if(resp==="no encontrado")return end("No encontré ese himno en la hoja. Quizás ya lo borraste; pulsa ↻ Actualizar.");
  if(resp!==null&&resp!=="ok")return end("El script respondió algo inesperado: "+resp.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,160));
  emsg("Verificando…");
  for(let i=0;i<5;i++){
    await new Promise(r=>setTimeout(r,1500));await load(true);
    if(!songs.some(z=>z.title===o.title&&z.num===o.num)){
      emsg("✓ Himno borrado");$("e_del").disabled=false;
      setTimeout(()=>closeEd(()=>{if(location.hash)location.hash="";else route()}),600);return}}
  end("El himno sigue en la hoja. Lo más probable es que el script sea la versión vieja: pega el script nuevo y publícalo como Nueva versión.")};
load();
</script>
</body>
</html>
