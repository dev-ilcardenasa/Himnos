<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Himnario</title>
<style>
:root{--side:clamp(18px,5vw,56px);--bg:#0d1b1e;--card:#12262a;--btn:#1e3438;--tx:#eef3f1;--mut:#7fa0a0;--gold:#e8b04a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
button,input{font:inherit;color:var(--tx)}
button{background:var(--btn);border:0;border-radius:8px;padding:10px 14px;cursor:pointer;min-height:42px}
button.on{color:var(--gold)}
#list{max-width:720px;margin:0 auto;padding:16px}
h1{font-family:Georgia,serif;color:var(--gold);margin:8px 0 12px}
#q{width:100%;padding:12px;border-radius:8px;border:1px solid var(--btn);background:var(--card);margin-bottom:12px}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.num{min-width:64px;text-align:center;font:700 22px Georgia,serif;color:var(--gold);background:#0a1416;border-radius:8px;padding:8px}
.num.no{color:var(--mut);font-size:20px}
.it small{color:var(--mut);display:block}
#view{display:none;height:100dvh;flex-direction:column;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-bottom:1px solid var(--btn)}
#head{display:flex;align-items:center;gap:12px;padding:6px 14px}
#head .num{font-size:26px}
#head h2{margin:0;font:700 clamp(18px,3.5vw,30px) Georgia,serif}
#head small{color:var(--mut)}
#wrap{flex:1;min-height:0;position:relative;padding:6px var(--side) 12px;touch-action:none;overflow:hidden}
#clip{height:100%;overflow:hidden}
#box{height:100%;overflow:visible;column-rule:1px solid #2a4448;column-gap:32px;column-fill:balance;transform-origin:0 0;will-change:transform}
.sec{break-inside:avoid;margin-bottom:.8em}
.sec.br{break-before:column}
.lb{font:italic 600 .8em Georgia,serif;color:var(--mut);margin-bottom:2px}
pre{margin:0;font-family:Arimo,Arial,"Liberation Sans",Helvetica,sans-serif;white-space:pre;line-height:1.3}
pre .c{color:var(--gold)}
.sec.cho pre{border-left:3px solid var(--gold);padding-left:8px}
body.nochords .c{display:none}
#pg{position:absolute;right:20px;bottom:14px;color:var(--mut);font-size:13px;pointer-events:none}
/* MODO SOLO HIMNO: nada más que la letra y los acordes */
body.focus #bar,body.focus #head,body.focus #pg{display:none}
body.focus #wrap{padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
#msg{padding:24px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<div id="list">
  <h1>Himnario <button id="rf" style="font-size:14px;float:right">↻ Actualizar</button></h1>
  <input id="q" placeholder="Buscar por número o título…" autocomplete="off">
  <div id="items"><div id="msg">Cargando himnos…</div></div>
</div>
<div id="view">
  <div id="bar">
    <button id="back">← Lista</button>
    <button id="fs">⤢</button><button id="foc">Solo himno</button>
    <button id="tm">− tono</button><button id="tl">0</button><button id="tp">+ tono</button>
    <button id="chb" class="on">Acordes</button>
    <button id="prev">◀</button><button id="next">▶</button>
  </div>
  <div id="head"></div>
  <div id="wrap"><div id="clip"><div id="box"></div></div><div id="pg"></div></div>
</div>
<script>
// ====== CONFIGURACIÓN: tu hoja publicada como CSV ======
const ID="1tO9AsCYWtmDe9mPcU7l7Eo5VF6vS9WJk5xodZw-R2GY";
const URLS=[
 "https://docs.google.com/spreadsheets/d/"+ID+"/gviz/tq?tqx=out:csv&sheet=Hoja%201",
 "https://docs.google.com/spreadsheets/d/"+ID+"/gviz/tq?tqx=out:csv",
 "https://docs.google.com/spreadsheets/d/"+ID+"/export?format=csv&gid=0",
 "https://docs.google.com/spreadsheets/d/e/2PACX-1vTuYxY7rCdH1x_wbM0tXiX0AQOKj2tOiBwJPBTrAE9ulYtnGIWiAyolBqDQTUUJFT94KQ_697S0ncB1/pub?gid=0&single=true&output=csv"];
// =======================================================
const $=id=>document.getElementById(id);
let songs=[],cur=null,semis=0,wl=null;

function parseCSV(t){const r=[];let row=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==','){row.push(c);c=""}
    else if(ch=='\n'){row.push(c);r.push(row);row=[];c=""}
    else if(ch!='\r')c+=ch}
  if(c||row.length){row.push(c);r.push(row)}return r}

async function load(){
  try{
    let txt=null,err="";
    for(const u of URLS){try{const r=await fetch(u+(u.includes("?")?"&":"?")+"nocache="+Date.now(),{cache:"no-store"});if(!r.ok){err="HTTP "+r.status;continue}
      const t=await r.text();if(t.trim().startsWith("<")){err="La hoja no es pública";continue}txt=t;break}catch(e){err=String(e.message||e)}}
    if(txt===null)throw new Error(err);
    const rows=parseCSV(txt);
    const h=rows[0].map(x=>x.trim().toLowerCase());
    const ix=n=>h.indexOf(n);
    songs=rows.slice(1).map(r=>({num:(r[ix("numero")]||"").trim(),title:(r[ix("titulo")]||"").trim(),tone:(r[ix("tono")]||"").trim(),text:(r[ix("letra")]||"").replace(/\r/g,"")})).filter(s=>s.title&&s.text);
    songs.sort((a,b)=>a.num&&!b.num?-1:!a.num&&b.num?1:a.num&&b.num?a.num.localeCompare(b.num,"es",{numeric:true}):a.title.localeCompare(b.title,"es"));
    renderList();route();
  }catch(e){const loc=location.protocol==="file:";
    $("items").innerHTML='<div id="msg">No se pudo leer la hoja ('+esc(e.message)+').<br><br>'+(loc?'Estás abriendo el archivo directamente. Publícalo en Netlify Drop y abre el link que te dé.':'Revisa que la hoja esté compartida como "Cualquier persona con el enlace: Lector".')+'</div>'}
}
function renderList(){
  const f=$("q").value.toLowerCase().trim();
  const l=songs.map((s,i)=>[s,i]).filter(([s])=>!f||s.title.toLowerCase().includes(f)||s.num.toLowerCase().includes(f));
  $("items").innerHTML=l.length?"":'<div id="msg">Sin resultados</div>';
  l.forEach(([s,i])=>{const d=document.createElement("div");d.className="it";
    d.innerHTML=`<div class="num ${s.num?"":"no"}">${s.num||"♪"}</div><div>${esc(s.title)}${s.tone?`<small>Tono ${esc(s.tone)}</small>`:""}</div>`;
    d.onclick=()=>{location.hash=i};$("items").appendChild(d)})}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
$("q").oninput=renderList;

// ===== acordes =====
const CH=/^[A-G][#b]?(m|maj|min|dim|aug|sus|add|M)?\d*(sus\d?|add\d)?(\/[A-G][#b]?)?$/;
const isChordLine=l=>{const t=l.trim().split(/\s+/);return l.trim()&&t.every(x=>x==="|"||x==="/"||x.split("-").every(y=>CH.test(y)))};
const SH=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"],FL=["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
function tr(ch,n,flat){return ch.replace(/[A-G][#b]?/g,m=>{let i=SH.indexOf(m);if(i<0)i=FL.indexOf(m);if(i<0)return m;return(flat?FL:SH)[(i+n+120)%12]})}
function transLine(l,n,flat){if(!n)return l;
  return l.replace(/(\S+)(\s*)/g,(m,c,sp)=>{const t=tr(c,n,flat);const d=t.length-c.length;
    return t+(d>0?sp.slice(Math.min(d,Math.max(sp.length-1,0))):" ".repeat(Math.max(0,sp.length-d)))})}

function build(){
  if(!cur)return;
  const flat=/b/.test(cur.text.split("\n").filter(isChordLine).join(" "));
  const secs=[];let s={label:"",lines:[],br:false};
  cur.text.split("\n").forEach(l=>{
    const m=l.trim().match(/^\[(.+)\]$/);
    if(m){if(/^columna$/i.test(m[1])){if(s.lines.length)secs.push(s);s={label:"",lines:[],br:true};return}
      if(s.lines.length||s.label)secs.push(s);s={label:m[1],lines:[],br:false};return}
    s.lines.push(l)});
  secs.push(s);
  const html=[];
  secs.forEach(x=>{
    while(x.lines.length&&!x.lines[x.lines.length-1].trim())x.lines.pop();
    const blocks=[];let cb=[];
    x.lines.forEach(l=>{if(l.trim())cb.push(l);else if(cb.length){blocks.push(cb);cb=[]}});
    if(cb.length)blocks.push(cb);
    blocks.forEach((bl,k)=>{
      const body=bl.map(l=>isChordLine(l)?`<span class="c">${esc(transLine(l,semis,flat))}</span>`:esc(l)).join("\n");
      html.push(`<div class="sec ${x.br&&k==0?"br":""} ${/coro/i.test(x.label)?"cho":""}">${x.label&&k==0?`<div class="lb">${esc(x.label)}</div>`:""}<pre>${body}</pre></div>`)})});
  $("box").innerHTML=html.join("");
  $("tl").textContent=(semis>0?"+":"")+semis;
  const tone=cur.tone?tr(cur.tone,semis,flat):"";
  $("head").innerHTML=`${cur.num?`<div class="num">${esc(cur.num)}</div>`:""}<div><h2>${esc(cur.title)}</h2>${tone?`<small>Tono ${esc(tone)}</small>`:""}</div>`;
  layout()}

// ===== ajuste de tamaño y columnas =====
let nc=1,sz=16,best=16,capW=40,pages=1,page=0;
const GAP=44,box=()=>$("box");
const wOK=b=>[...b.querySelectorAll("pre")].every(e=>e.scrollWidth<=e.clientWidth+1);
const allOK=b=>b.scrollWidth<=b.clientWidth+2&&wOK(b);
function setCols(n){const b=box();b.style.columnGap=GAP+"px";b.style.columnCount=n}
function fitN(n){const b=box();setCols(n);let lo=4,hi=48;
  while(hi-lo>.4){const m=(lo+hi)/2;b.style.fontSize=m+"px";if(allOK(b))lo=m;else hi=m}return lo}
function capWidth(){const b=box();setCols(1);let lo=4,hi=90;
  while(hi-lo>.4){const m=(lo+hi)/2;b.style.fontSize=m+"px";if(wOK(b))lo=m;else hi=m}return lo}
function shift(dx,anim){const b=box();b.style.transition=anim?"transform .2s":"none";
  b.style.transform=`translateX(${-page*(b.clientWidth+GAP)+dx}px)`}
function info(){$("pg").textContent=pages>1?`${page+1}/${pages}`:"";
  const d=pages>1?"":"none";["prev","next"].forEach(i=>$(i).style.display=d)}
function go(d){page=Math.max(0,Math.min(pages-1,page+d));shift(0,true);info()}
function place(v){const b=box();b.style.fontSize=v+"px";setCols(1);
  if(allOK(b))nc=1;else{setCols(2);if(wOK(b))nc=2;else{setCols(1);nc=1}}
  const W=b.clientWidth,cw=(W-(nc-1)*GAP)/nc,cnt=Math.max(1,Math.round((b.scrollWidth+GAP)/(cw+GAP)));
  pages=Math.ceil(cnt/nc);page=Math.min(page,pages-1);shift(0,false);info()}
function setSize(v){sz=Math.max(best,Math.min(capW,v));place(sz)}
function layout(){
  const land=innerWidth>innerHeight&&innerWidth>640,c=land||innerWidth>900?[2]:[1,2];
  best=0;c.forEach(n=>{const f=fitN(n);if(f>best+.3)best=f});
  capW=Math.max(best,capWidth());page=0;sz=best;place(best)}

// ===== botones (solo modo normal) =====
$("tp").onclick=()=>{semis=Math.min(11,semis+1);build()};
$("tm").onclick=()=>{semis=Math.max(-11,semis-1);build()};
$("tl").onclick=()=>{semis=0;build()};
$("chb").onclick=()=>{document.body.classList.toggle("nochords");$("chb").classList.toggle("on");layout()};
$("back").onclick=()=>{location.hash=""};
$("fs").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()};

// ===== modo Solo himno: solo letra + acordes, sin nada más =====
const inFocus=()=>document.body.classList.contains("focus");
function foc(on){
  document.body.classList.toggle("focus",on);
  if(on){try{document.documentElement.requestFullscreen?.()?.catch(()=>{})}catch(e){}}
  else if(document.fullscreenElement){document.exitFullscreen().catch(()=>{})}
  layout()}
$("foc").onclick=()=>foc(true);
// si el usuario sale de pantalla completa (gesto atrás), también sale del modo
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&inFocus()){document.body.classList.remove("focus");layout()}});

// ===== gestos =====
// Pellizco: cambia el tamaño. Deslizar: pasa de página. Doble toque: en Solo himno vuelve al modo normal; en modo normal restablece el tamaño.
const W=$("wrap");let g=null,sx=0,dx=0,lt=0,drag=false,moved=false;
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
const reset=()=>{page=0;setSize(best)};
const dbl=()=>inFocus()?foc(false):reset();
W.addEventListener("touchstart",e=>{
  if(e.touches.length==2){g={d:dist(e.touches),s:sz};drag=false}
  else{sx=e.touches[0].clientX;dx=0;drag=true;moved=false}},{passive:false});
W.addEventListener("touchmove",e=>{e.preventDefault();
  if(e.touches.length==2&&g)setSize(g.s*dist(e.touches)/g.d);
  else if(e.touches.length==1&&drag){dx=e.touches[0].clientX-sx;if(Math.abs(dx)>10)moved=true;if(pages>1)shift(dx,false)}},{passive:false});
W.addEventListener("touchend",e=>{if(e.touches.length<2)g=null;
  if(e.touches.length==0&&drag){drag=false;
    if(!moved){const n=Date.now();if(n-lt<300){lt=0;dbl();return}lt=n}
    const st=box().clientWidth*.15;
    if(dx<-st)page=Math.min(pages-1,page+1);else if(dx>st)page=Math.max(0,page-1);
    shift(0,true);info();dx=0}});
W.addEventListener("wheel",e=>{e.preventDefault();setSize(sz*(e.deltaY<0?1.1:.9))},{passive:false});
W.addEventListener("dblclick",dbl);
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
addEventListener("keydown",e=>{if(!cur)return;if(e.key=="ArrowRight")go(1);if(e.key=="ArrowLeft")go(-1);if(e.key=="Escape"&&inFocus())foc(false)});
addEventListener("resize",()=>{if(cur)layout()});

async function keepAwake(on){try{if(on&&navigator.wakeLock)wl=await navigator.wakeLock.request("screen");else if(wl){wl.release();wl=null}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(cur&&document.visibilityState=="visible")keepAwake(true)});

function route(){
  const i=parseInt(location.hash.slice(1));
  if(songs[i]){cur=songs[i];semis=0;$("list").style.display="none";$("view").style.display="flex";keepAwake(true);build()}
  else{document.body.classList.remove("focus");cur=null;$("view").style.display="none";$("list").style.display="block";keepAwake(false)}}
addEventListener("hashchange",route);
$("rf").onclick=()=>{$("items").innerHTML='<div id="msg">Cargando himnos…</div>';load()};
document.fonts&&document.fonts.ready.then(()=>{if(cur)layout()});
load();
</script>
</body>
</html>
